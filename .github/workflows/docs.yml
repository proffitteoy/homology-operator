name: Documentation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Check Markdown source links
        run: pwsh -NoProfile -File ./scripts/check_docs.ps1
      - name: Build Chinese documentation
        run: python -m sphinx -E -n -W --keep-going -b html docs .task-artifacts/docs-site
      - name: Build English documentation
        run: python -m sphinx -E -n -W --keep-going -b html docs/en .task-artifacts/docs-site/en
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: .task-artifacts/docs-site
          if-no-files-found: error
