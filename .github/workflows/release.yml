name: Publish Python package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.5"
      - run: uv sync --locked --python ${{ matrix.python }}
      - name: Match release tag to package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --locked python -c "import os, homology_operator; assert os.environ['RELEASE_TAG'] == 'v' + homology_operator.__version__"
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python examples/single_scale.py
      - run: uv run --locked python examples/filtration.py
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: pwsh -NoProfile -File ./scripts/check_docs.ps1
      - run: uv build --no-build-isolation
      - run: uv tool run --from twine==6.2.0 twine check --strict dist/*
      - name: Test the installed wheel independently of the source tree
        run: |
          uv venv .task-artifacts/release-env --python ${{ matrix.python }}
          uv pip install --python .task-artifacts/release-env/bin/python dist/*.whl
          .task-artifacts/release-env/bin/python -I -c "import homology_operator; from homology_operator.native import backend_info; assert backend_info()['native'] == 'Unavailable'; print(homology_operator.__version__)"
          .task-artifacts/release-env/bin/python -I -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.10'
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/homology-operator/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
