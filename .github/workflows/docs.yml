name: Documentation and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Check Markdown source links
        run: pwsh -NoProfile -File ./scripts/check_docs.ps1
      - name: Build Chinese documentation
        run: python -m sphinx -E -n -W --keep-going -b html docs .task-artifacts/docs-site
      - name: Build English documentation
        run: python -m sphinx -E -n -W --keep-going -b html docs/en .task-artifacts/docs-site/en
      - run: touch .task-artifacts/docs-site/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: .task-artifacts/docs-site
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .task-artifacts/docs-site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
