name: Native prototype checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      matrix:
        include:
          - os: windows-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.5"
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build and install optional release wheel
        run: |
          $pythonPath = uv run --locked python -c "import sys; print(sys.executable)"
          uv tool run --from maturin==1.15.0 maturin build --manifest-path native/Cargo.toml --release --locked --interpreter $pythonPath --out .task-artifacts/native-wheels
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $wheel = Get-ChildItem .task-artifacts/native-wheels/*.whl
          uv pip install --python $pythonPath $wheel.FullName
          exit $LASTEXITCODE
      - name: Require native differential and regression tests
        env:
          HOMOLOGY_NATIVE_REQUIRED: "1"
        run: uv run --locked --no-sync python -m unittest discover -s tests -v
      - name: Check installed reference and native wheels in isolation
        env:
          HOMOLOGY_NATIVE_REQUIRED: "1"
        run: |
          $pythonPath = uv run --locked --no-sync python -c "import sys; print(sys.executable)"
          uv build --no-build-isolation
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv venv .task-artifacts/installed-env --python $pythonPath
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $installedPython = if ($IsWindows) { '.task-artifacts/installed-env/Scripts/python.exe' } else { '.task-artifacts/installed-env/bin/python' }
          $referenceWheel = Get-ChildItem dist/*.whl
          $nativeWheel = Get-ChildItem .task-artifacts/native-wheels/*.whl
          uv pip install --python $installedPython $referenceWheel.FullName $nativeWheel.FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $installedPython -I -c "from homology_operator.native import backend_info; info = backend_info(); assert info['native'] == 'Available', info; print(info)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $installedPython -I -m unittest discover -s tests -p test_integration.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $installedPython -I -m unittest discover -s tests -p test_legacy_results.py -v
          exit $LASTEXITCODE
