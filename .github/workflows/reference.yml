name: Reference checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.5"
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv build --no-build-isolation
      - name: Check wheel in an isolated environment
        shell: bash
        run: |
          uv venv .task-artifacts/wheel-env --python ${{ matrix.python }}
          uv pip install --python .task-artifacts/wheel-env/bin/python dist/*.whl
          .task-artifacts/wheel-env/bin/python -I -c "import homology_operator; print(homology_operator.__version__)"
      - run: pwsh -NoProfile -File ./scripts/check_docs.ps1
      - run: git diff --check
