name: Reference checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.5"
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python examples/single_scale.py
      - run: uv run --locked python examples/filtration.py
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv build --no-build-isolation
      - name: Check wheel in an isolated environment
        shell: bash
        run: |
          uv venv .task-artifacts/wheel-env --python ${{ matrix.python }}
          uv pip install --python .task-artifacts/wheel-env/bin/python dist/*.whl
          .task-artifacts/wheel-env/bin/python -I -c "import homology_operator; print(homology_operator.__version__)"
          .task-artifacts/wheel-env/bin/python -I -c "from homology_operator.native import backend_info; info=backend_info(); assert info['native']=='Unavailable', info; print(info)"
          .task-artifacts/wheel-env/bin/python -I -m unittest discover -s tests -p test_integration.py -v
          .task-artifacts/wheel-env/bin/python -I -m unittest discover -s tests -p test_legacy_results.py -v
          .task-artifacts/wheel-env/bin/python -I -m unittest discover -s tests -p test_s4_integration.py -v
      - run: pwsh -NoProfile -File ./scripts/check_docs.ps1
      - run: git diff --check
      - name: Check whitespace in the complete pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
