[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "homology-operator"
version = "0.0.2.dev0"
description = "Boundary-native F2 homology operators and finite filtration reference"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/proffitteoy/homology-operator"
Documentation = "https://proffitteoy.github.io/homology-operator/"
Issues = "https://github.com/proffitteoy/homology-operator/issues"

[dependency-groups]
dev = ["hatchling==1.27.0", "ruff==0.11.13"]
oracle = [
    "gudhi==3.11.0",
    "numpy==2.2.6",
]
oracle-secondary = [
    "joblib==1.5.2",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    "threadpoolctl==3.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/homology_operator"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
